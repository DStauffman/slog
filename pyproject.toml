[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slog"
version = "1.5.1"
description = "Extends the built-in Python logging module with some convenient functions and custom log levels."
readme = "README.rst"
dependencies = []
requires-python = ">=3.11,<4.0"
authors = [
  {name = "David C. Stauffer", email = "dstauffman@yahoo.com"},
]
maintainers = [
  {name = "David C. Stauffer", email = "dstauffman@yahoo.com"},
]
license = { file = "LICENSE" }
keywords = ["packaging", "logging"]
classifiers = [
    "Topic :: Software Development",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Langauge :: Python :: 3.11",
    "Programming Langauge :: Python :: 3.12",
    "Programming Langauge :: Python :: 3.13",
    "Programming Langauge :: Python :: 3.14",
    "Programming Langauge :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[dependency-groups]
static = ["black>=25.0", "isort>=5.10", "mypy>=1.5", "pylint>=2.16"]
test = ["pytest>=7.4", "pytest-cov>=4.0"]

[project.urls]
Repository = "https://github.com/DStauffman/slog"
Issues = "https://github.com/DStauffman/slog/issues"
Changelog = "https://github.com/DStauffman/slog/blob/main/CHANGELOG.md"

[project.scripts]
slog = "slog.cli:main"

[tool.setuptools.packages.find]
where = ["slog"]

[tool.setuptools.package-data]
slog = ["CHANGELOG.md", "LICENSE.txt", "pyproject.toml", "README.rst"]

[tool.black]
line-length = 128
target_version = ["py314"]
include = '\.pyi?$'

[tool.coverage.run]
branch = true
omit = ["*/site-packages/*", "*/.eggs/*"]
disable_warnings = ["couldnt-parse"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Create platform independent pragmas (potentially have the test runner modify this)
    "pragma: noc unix",
    #"pragma: noc windows",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    "def _main",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",

    # Don't complain about typing overloads
    "@overload"
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.xml]
output = "coverage_html_report/coverage.xml"

[tool.isort]
py_version = 314
profile = "black"
line_length = 128
combine_as_imports = true
force_sort_within_sections = true
case_sensitive = true
force_alphabetical_sort_within_sections = true
skip_glob = ["__init__.py", "*/__init__.py"]

[tool.mypy]
show_error_codes       = true
warn_return_any        = true
warn_unused_configs    = true
warn_unreachable       = true
warn_unused_ignores    = true
disallow_untyped_calls = true
disallow_untyped_defs  = true
no_implicit_optional   = true
files                  = ["$MYPY_CONFIG_FILE_DIR/slog/**/*.py"]

[tool.pylint.messages_control]
max-line-length = 128
disable = ["C0103", "C0301", "C0411", "C0414", "E0401", "E0601", "E0606", "E0611", "E1101", "R0401", "R0402", "R0801", "R0902", "R0903", "R0912", "R0913", "R0914", "R0915", "W0511", "W0702"]
enable = ["I0021"]
ignore-paths = "^(.*[/\\\\]|)tests[/\\\\]test_.*$"

[tool.ruff]
include = ["pyproject.toml", "slog/**/*.py"]
line-length = 128
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "D203",  # one blank line required before class docstring
    "D212",  # multiline docstring summary should start at the first line
    "D401",  # first line of docstring should be in imperative mood
    "E501",  # line too long, (use black to manage this)
    "I001",  # Import block is un-sorted or un-formatted (use isort to manage this)
    "S101",  # Use of assert
    "T201",  # `print` found
    "COM812",  # Add trailing comma
    "EM101",  # exception must not use string literal
    "EM102",  # exception must not use f-string
    "FBT001",  # boolean type in positional argument
    "FBT002",  # boolean default in positional argument
    "FBT003",  # boolean value in functional call
    "FIX002",  # line contains TODO
    "PLC0414",  # import alias does not rename original package
    "PT009",  # Use assert instead of unittest assertEqual
    "PT027",  # Use raises instead of assertRaises
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link in TODO
    "TRY003",  # Avoid specifying long messages outside exceptions
    "UP015",  # Unnecessary mode argument
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
"slog/tests/*" = ["D102", "D205", "D400", "D415", "N801", "N802", "PIE790"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.ty.analysis]
# Disable support for `type: ignore` comments, so that they only apply to mypy
respect-type-ignore-comments = false

# Relax rules for test files
[[tool.ty.overrides]]
include = ["**/tests/test_*.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
